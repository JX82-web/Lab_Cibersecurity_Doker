services:
  sqli_db:
    image: mariadb:10.11
    container_name: ctf_sql_union_db
    restart: unless-stopped
    command: --secure-file-priv=""
    environment:
      MYSQL_ROOT_PASSWORD: RootDB_Union_2026!
      MYSQL_DATABASE: unionlab
      MYSQL_USER: web_user
      MYSQL_PASSWORD: WebDB_Union_2026!
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./web/app/uploads:/var/www/html/uploads
      - /var/www/html/backup_tasks
    networks: [union_net]

  union_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ctf_sql_union_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "222:22"
    volumes:
      - ./web/app:/var/www/html
    depends_on: [sqli_db]
    networks: [union_net]

networks:
  union_net:
    driver: bridge
