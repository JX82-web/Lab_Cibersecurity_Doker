<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Plugin - Cybernetic Shop Admin</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <header class="header header-admin">
        <div class="container">
            <h1 class="logo"><a href="/admin/">Cybernetic Shop - Admin</a></h1>
            <nav class="nav">
                <ul>
                    <li><a href="/admin/">Utenti</a></li>
                    <li><a href="/admin/plugins.html" class="active">Plugin</a></li>
                    <li><a href="/">Vetrina</a></li>
                    <li><button id="logout-btn" class="btn btn-secondary">Logout</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="admin-panel">
                <div class="admin-header">
                    <h2>Gestione Plugin</h2>
                    <p class="subtitle">Installa, attiva e gestisci plugin esterni</p>
                </div>

                <section class="plugin-section">
                    <h3>Installa Nuovo Plugin</h3>
                    <form id="install-plugin-form" enctype="multipart/form-data" class="plugin-install-form">
                        <div class="form-group">
                            <label for="plugin-zip">File Plugin (.zip)</label>
                            <input type="file" id="plugin-zip" name="plugin" accept=".zip" required>
                            <small class="form-hint">Il file ZIP deve contenere manifest.json e plugin.php</small>
                        </div>
                        <button type="submit" class="btn btn-primary" id="install-btn">Installa Plugin</button>
                        <div id="install-result" class="install-result" style="display:none;"></div>
                    </form>
                </section>

                <section class="plugin-section">
                    <h3>Plugin Installati</h3>
                    <div class="plugins-grid" id="plugins-grid">
                        <div class="loading">Caricamento plugin...</div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="/assets/css/js/auth.js"></script>
    <script src="/assets/css/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init();
            if (Auth.isAuthenticated() && Auth.getUserRole() === 'admin') {
                Admin.initPlugins();
            } else {
                window.location.href = '/login.html';
            }
        });
    </script>
</body>
</html>
