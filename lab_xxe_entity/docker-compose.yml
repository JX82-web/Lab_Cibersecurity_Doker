

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab_web
    ports:
      - "80:80"
      - "2223:22"
    volumes:
      - ./web:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  db:
    image: mariadb:10.6
    container_name: lab_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: webapp
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpass123
    volumes:
      - dbdata:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  dbdata:
